<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 15px;
      font-family: Arial, sans-serif;
    }
    .status {
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 15px;
      text-align: center;
    }
    .logged-in {
      background: #d4edda;
      color: #155724;
    }
    .logged-out {
      background: #f8d7da;
      color: #721c24;
    }
    button {
      width: 100%;
      padding: 8px;
      margin: 5px 0;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    .user-info {
      background: #e9ecef;
      padding: 10px;
      border-radius: 4px;
      margin: 10px 0;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h3>图片下载器</h3>
  
  <div id="status" class="status">
    检查状态中...
  </div>

  <div id="userInfo" class="user-info" style="display: none;">
    <div><strong>用户名:</strong> <span id="userName"></span></div>
    <div style="display:none"><strong>用户ID:</strong> <span id="userId"></span></div>
  </div>

  <button id="loginBtn">登录账号</button>
  <button id="refreshBtn">刷新状态</button>
  <!-- <button id="optionsBtn">设置用户信息</button> -->

  <script src="popup.js"></script>
</body>
</html>
